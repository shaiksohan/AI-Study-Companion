# Render Blueprint: provisions the Flask backend as a web service.
#
# How it works:
#   1. Push this file to GitHub (it must stay at the repository root).
#   2. In Render: New -> Blueprint -> select this repository.
#   3. After the first deploy, set OLLAMA_API_URL (in the service's
#      Environment page) to the public URL of your Ollama server,
#      e.g. the HTTPS address from `cloudflared tunnel --url http://localhost:11434`.
#
# AI features stay powered by YOUR local Ollama - no paid AI APIs involved.
# While OLLAMA_API_URL is unset or unreachable, the app shows its
# "Ollama is not running" banner instead of faking answers.

services:
  - type: web
    name: ai-study-companion-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # --workers 1 keeps memory low on the free plan; --timeout 300 matches
    # OLLAMA_TIMEOUT so slow local-model replies are not killed mid-generation.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: OLLAMA_MODEL
        value: qwen2.5-coder:7b
      - key: OLLAMA_API_URL
        # Set this in the Render dashboard after your tunnel is running
        # (the URL changes per quick-tunnel session, so it is not committed).
        sync: false
